<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Позови светлячка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#10204f 0,#060a1c 70%);font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;color:#1a1020;user-select:none;-webkit-user-select:none;display:flex;overflow:hidden}
body.port{overflow-y:auto;overflow-x:hidden}
#main{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;width:100%}
body.port #main{align-items:flex-start;flex:none}
#langBar{direction:ltr;flex:none;width:100%;background:#0a0f26;border-bottom:4px solid #000;padding:4px 6px;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;height:34px;overflow:hidden}
.lb{padding:0 10px;height:24px;border-radius:12px;border:2.5px solid #000;background:#1b2750;color:#aab4de;font:900 12px 'Trebuchet MS',Verdana,sans-serif;cursor:pointer;box-shadow:0 2px 0 #000}
.lb.on{background:#ffd23f;color:#1a1020}
#scene,#lua,.st{direction:ltr}
#captxt{direction:inherit}
#luat{direction:ltr;text-align:left}
#holder{position:relative;flex:none}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0}
#wrap.land{width:1000px;height:560px}
#wrap.port{width:420px;height:920px}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid #fff;outline-offset:2px}
.ic{width:1em;height:1em;display:block;fill:currentColor}

/* comic frames */
.frame{position:absolute;background:#000}
.frame>.in{position:absolute;inset:5px;overflow:hidden}
#scene{clip-path:polygon(0 0,100% 0,100% 99%,0 100%)}
#scene>.in{clip-path:polygon(0 0,100% 0,100% 99%,0 100%)}
.land #scene{left:0;top:0;width:524px;height:560px}
.land #coder{left:516px;top:0;width:484px;height:560px;clip-path:polygon(1.5% 0,100% 0,100% 100%,0 100%)}
.land #coder>.in{clip-path:polygon(1.5% 0,100% 0,100% 100%,0 100%)}
.port #scene{left:0;top:0;width:420px;height:370px}
.port #coder{left:0;top:362px;width:420px;height:558px}
.port .pb{font-size:14px;padding:0 2px;gap:2px}.port .pb .pl{display:none}.port #reset{width:40px;flex:none}

/* scene */
#scene .in{background:linear-gradient(#040824 0,#0c1a4a 35%,#1b3a78 62%,#25508a 70%)}
#scene .in>*{position:absolute}
#stars{inset:0;width:100%;height:100%;pointer-events:none}
#bg{inset:0;width:100%;height:100%;pointer-events:none}
.twk{animation:twk 3s ease-in-out infinite}
@keyframes twk{50%{opacity:.25}}
#strip{left:0;right:0;top:42%;height:22%;background:url(assets/strip-dark.jpg) left center/auto 100% no-repeat;opacity:.9;-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%);pointer-events:none}
.fin #strip{background-image:url(assets/strip-lit.jpg)}
#ground{left:0;right:0;bottom:0;height:33%;background:
 linear-gradient(#000,#000) 0 0/100% 4px no-repeat,
 repeating-linear-gradient(90deg,#3f9a3a 0 22px,#348a31 22px 44px) 0 4px/100% 14px no-repeat,
 linear-gradient(#173d1c,#173d1c) 0 18px/100% 6px no-repeat,
 repeating-linear-gradient(90deg,#4a321f 0 22px,#3d2918 22px 44px) 0 24px/100% 100%;pointer-events:none}
#halft{inset:0;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,.45) 1.1px,transparent 1.6px) 0 0/7px 7px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,transparent 45%,#000 100%);mask-image:radial-gradient(ellipse at 50% 45%,transparent 45%,#000 100%)}
#beacon{left:24%;width:52%;top:3%;height:auto;aspect-ratio:260/300;pointer-events:none;--cap:#5b2030;--capd:#3d1420;--lamp:#2a2018;--lampstroke:#0b0a14}
#beacon.lit{--cap:#d83a3a;--capd:#a12530;--lamp:#ffd24a}
#beacon .lamp{fill:var(--lamp);stroke:#0b0a14;stroke-width:3}
#beacon.lit .lamp{filter:drop-shadow(0 0 5px #ffb300)}
#beacon.lit{filter:drop-shadow(0 0 26px rgba(255,190,70,.55))}
#dust{height:7px;background:#5a1010;border:2px solid #000;border-radius:3px;transition:background .06s,box-shadow .06s}
#dust.on{background:#ff3b30;box-shadow:0 0 12px 3px rgba(255,60,40,.9)}
#lampbox>*{position:absolute}
#colls>*{position:absolute}
#lampbox{width:72px;height:96px;transform:translate(-50%,-62%)}
#ped{left:-6px;right:-6px;bottom:0;height:28px;background:repeating-linear-gradient(90deg,#8d939c 0 12px,#7a808a 12px 24px);border:3px solid #000;border-radius:2px}
#lamp{left:4px;top:0;width:64px;height:64px;border:3px solid #000;background:#000;transition:filter .05s}
#lamp svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
#lamp .on{display:none}
#lamp.on .on{display:block}
#lamp.on .off{display:none}
#lamp.on{filter:drop-shadow(0 0 16px #ffc233) drop-shadow(0 0 34px rgba(255,170,30,.8))}
#lamp.glitch{animation:gl .5s steps(2) 1}
@keyframes gl{0%,100%{filter:hue-rotate(0)}25%{filter:hue-rotate(250deg) brightness(1.7)}50%{transform:translateX(3px)}75%{filter:hue-rotate(250deg);transform:translateX(-3px)}}
.fly{width:30px;height:30px;transform:translate(-50%,-50%);pointer-events:none;--h:75;--g:hsl(var(--h) 100% 62%)}
.fly .w{position:absolute;top:2px;width:15px;height:11px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #000;animation:wing .22s ease-in-out infinite alternate}
.fly .w1{left:0;transform-origin:100% 100%}
.fly .w2{right:0;transform-origin:0 100%;animation-delay:.11s}
@keyframes wing{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.fly .b{position:absolute;left:8px;top:9px;width:14px;height:18px;border-radius:50%;border:2.5px solid #000;background:hsl(var(--h) 25% 22%)}
.fly.on .b{background:var(--g);box-shadow:0 0 14px 7px hsla(var(--h),100%,60%,.85),0 0 40px 18px hsla(var(--h),100%,55%,.45)}
.fly.coll .b{background:var(--g);box-shadow:0 0 10px 4px hsla(var(--h),100%,60%,.8)}
.fly.big{transform:translate(-50%,-50%) scale(1.25)}
#wild.hide{display:none}
#spark{width:104px;height:114px;transform:translate(-50%,-62%);animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,190,80,.85))}
@keyframes bob{50%{margin-top:-9px}}
#helper{width:76px;height:84px;transform:translate(-50%,-70%)}
#helper svg,#spark svg{width:100%;height:100%;display:block;overflow:visible}
.cheer#spark,.cheer#helper{animation:hop .45s ease-in-out 3}
@keyframes hop{50%{margin-top:-24px}}
.spark .e2,.spark .m2,.spark .m3,.spark .sw{display:none}
.spark.cheer .e1,.spark.cheer .m1{display:none}
.spark.cheer .e2,.spark.cheer .m2{display:inline}
.spark.oops .m1{display:none}
.spark.oops .m3,.spark.oops .sw{display:inline}
.spark.talk .m1{display:none}
.spark.talk .m2{display:inline}
#hud{left:8px;top:8px;display:flex;gap:6px;align-items:center;z-index:5}
#hudr{right:8px;top:8px;display:flex;gap:8px;z-index:5}
.pip{width:20px;height:20px;border:3px solid #000;border-radius:50%;background:#1b2750}
.pip.done{background:hsl(var(--h) 100% 62%);box-shadow:0 0 10px hsl(var(--h) 100% 60%)}
.pip.cur{border-color:#fff;animation:pp 1s infinite}
@keyframes pp{50%{transform:scale(1.25)}}
.rb{width:42px;height:42px;border:3px solid #000;border-radius:50%;background:#ffd23f;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #000;color:#1a1020}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.rb.pulse{animation:pp .8s infinite}
.rb .ic{width:22px;height:22px}
#cap{direction:inherit;left:10px;right:10px;bottom:10px;min-height:78px;background:#ffeeb0;border:4px solid #000;border-radius:6px;padding:8px 10px 8px 62px;font-size:18px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:10px;z-index:6;transform:rotate(-.4deg);box-shadow:4px 4px 0 rgba(0,0,0,.55)}
#cap .face{position:absolute;left:6px;top:50%;margin-top:-23px;width:46px;height:50px}
#cap .face svg{width:100%;height:100%;overflow:visible}
#cap .txt{flex:1}
#capbtn{flex:none;border:3px solid #000;border-radius:10px;background:#3ddc84;font-weight:900;font-size:17px;padding:8px 12px;box-shadow:0 3px 0 #000;color:#052}
#capbtn[hidden]{display:none}
#arrow{width:0;height:0;border:14px solid transparent;border-top:22px solid #fff;filter:drop-shadow(0 0 3px #000) drop-shadow(0 0 8px #fff);animation:ar .7s ease-in-out infinite alternate;z-index:50;pointer-events:none;display:none;position:absolute}
@keyframes ar{to{margin-top:-10px}}
.spot{animation:sp 1s ease-in-out infinite}
@keyframes sp{50%{box-shadow:0 0 0 6px rgba(255,255,255,.9)}}

/* coder */
#coder .in{background:#16204a;display:flex;flex-direction:column;padding:10px 12px 10px;gap:6px;background-image:radial-gradient(circle,rgba(255,255,255,.07) 1.2px,transparent 1.7px);background-size:8px 8px}
#prog{flex:1;min-height:0;display:flex;flex-direction:column}
.rep{flex:none;display:flex;align-items:center;gap:8px;background:#ff9f1c;border:3px solid #000;border-radius:10px 10px 10px 0;padding:4px 8px;height:48px;font-weight:900;font-size:20px;color:#2a1200}
.rep .ic{width:26px;height:26px}
.rep .sp{flex:1}
#body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-inline-start:12px;border-inline-start:14px solid #ff9f1c;padding:5px 8px;display:flex;flex-direction:column;gap:3px;background:rgba(0,0,0,.22);scrollbar-width:thin}
.repcap{flex:none;height:14px;background:#ff9f1c;border:3px solid #000;border-top:0;border-radius:0 0 10px 10px;margin-inline-end:60%}
.tile{flex:none;display:flex;align-items:center;gap:5px;height:36px;border:3px solid #000;border-radius:8px;padding:0 4px 0 6px;font-weight:900;font-size:17px;transition:box-shadow .08s}
.tile.on{background:#ffe14d}.tile.off{background:#8a97c4}.tile.wait{background:#6ee0d0}
.tile.run{box-shadow:0 0 0 4px #fff,0 0 14px 5px #ffd23f;z-index:2}
.tile .ic{width:22px;height:22px}
.tile .lbl{min-width:70px}
.tile .sp{flex:1}
.mini{width:30px;height:30px;border:3px solid #000;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 0 #000;font-weight:900;font-size:20px;line-height:1}
.mini:active{transform:translateY(2px);box-shadow:none}
.mini[disabled]{opacity:.3;cursor:default}
.mini .ic{width:16px;height:16px}
.mini.x{background:#ff7a7a}
.st{display:flex;align-items:center;gap:3px}
.st b{min-width:30px;text-align:center;font-size:22px;background:#fff;border:3px solid #000;border-radius:7px;height:30px;line-height:24px}
.rep .st b{height:32px;line-height:26px}
#pal{flex:none;display:flex;gap:6px}
.pb{flex:1;height:42px;border:3px solid #000;border-radius:10px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 #000;padding:0 4px}
.pb:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.pb.on{background:#ffe14d}.pb.off{background:#8a97c4}.pb.wait{background:#6ee0d0}
.pb[disabled]{opacity:.45}
.pb .ic{width:20px;height:20px}
.pb .pl{font-size:22px;line-height:1}
#reset{flex:none;width:46px;background:#d9dcef;padding:0}
#lua{flex:none;display:flex;gap:6px;align-items:flex-start;color:#9aa3c4;font-family:Consolas,"Courier New",monospace;font-size:11.5px;line-height:1.25;height:38px;overflow:hidden}
#lua .hi{flex:none;width:24px;height:26px;opacity:.85}
#luat{word-break:break-word}
#ctl{flex:none;display:flex;gap:8px}
#run,#next{flex:1.6;height:56px;border:4px solid #000;border-radius:12px;background:#3ddc84;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 #000;color:#052}
#run.stop{background:#ff7a7a;color:#300}
#next{flex:1;background:#ffd23f;color:#2a1200}
#run:active,#next:active,#show:active,#again:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
#show{flex:1;height:56px;border:4px solid #000;border-radius:12px;background:#9ad8ff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 #000;color:#012}
#run .ic,#show .ic,#next .ic{width:28px;height:28px}
#run[disabled],#show[disabled]{opacity:.5}
#fin{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#fin .big{width:170px;height:186px}
#fin .big svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 18px rgba(255,190,80,.9))}
#fin .t{font-size:26px;font-weight:900;color:#ffe9a8;text-shadow:0 3px 0 #000;max-width:360px;line-height:1.15}
#again{height:62px;padding:0 26px;border:4px solid #000;border-radius:14px;background:#3ddc84;font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 #000;color:#052}
#again .ic{width:30px;height:30px}
.fin #prog,.fin #pal,.fin #lua,.fin #ctl{display:none}
.fin #fin{display:flex}
.port #cap{font-size:15px;min-height:64px;padding-left:56px}
.port #cap .face{width:40px;height:44px}
.port #lampbox{transform:translate(-50%,-62%) scale(.8)}

#glitch{width:66px;height:55px;transform:translate(-50%,-60%);pointer-events:none;opacity:0;z-index:4}
#glitch svg{width:100%;height:100%;display:block;overflow:visible;shape-rendering:crispEdges;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(0 0 9px #b46bff);animation:jit .25s steps(2) infinite}
@keyframes jit{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(1px,2px)}}
#bang{display:none;z-index:9;pointer-events:none;min-width:120px;height:92px;transform:translate(-50%,-50%);align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:22px;line-height:1;color:#fff;-webkit-text-stroke:0;text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 3px 0 #000;padding:0 18px}
#bang.show{display:flex;animation:bangp .95s ease-out forwards}
#bang::before{content:"";position:absolute;inset:0;z-index:-1;background:#8e44ff;clip-path:var(--star);filter:drop-shadow(0 0 0 #000)}
#bang.good::before{background:#3ddc84}
#bang::after{content:"";position:absolute;inset:6px;z-index:-1;background:#ffd23f;clip-path:var(--star);opacity:.9}
@keyframes bangp{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.05) rotate(0);opacity:0}}
#boom{inset:0;z-index:7;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at var(--bx,50%) var(--by,60%),rgba(255,246,170,.95) 0 5deg,transparent 5deg 14deg);-webkit-mask-image:radial-gradient(circle at var(--bx,50%) var(--by,60%),#000 0,#000 8%,transparent 60%);mask-image:radial-gradient(circle at var(--bx,50%) var(--by,60%),#000 0,#000 8%,transparent 60%)}
#boom.go{animation:boom .8s ease-out}
@keyframes boom{0%{opacity:1;transform:scale(.4);transform-origin:var(--bx) var(--by)}100%{opacity:0;transform:scale(1.7);transform-origin:var(--bx) var(--by)}}
#flash{inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
.pt{position:absolute;width:7px;height:7px;pointer-events:none;z-index:7;background:hsl(var(--h,50) 100% 66%);box-shadow:0 0 8px hsl(var(--h,50) 100% 60%)}
.pt.deb{box-shadow:none;border:1.5px solid #000;width:6px;height:6px}
.star{position:absolute;z-index:1;width:70px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(30deg);pointer-events:none;animation:star .9s linear forwards}
@keyframes star{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-170px 100px}}
#scene.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
#spark.flip svg{animation:flip .9s ease-in-out}
@keyframes flip{to{transform:rotate(360deg)}}
#helper .hf2{display:none}
#helper.cheer .hf1{display:none}
#helper.cheer .hf2{display:inline}
#helper.tap svg{animation:tap .2s ease-out}
@keyframes tap{50%{transform:translateY(-7px) scale(1.07);filter:brightness(1.7)}}
.tile.run{animation:tpl .33s ease-in-out infinite alternate}
@keyframes tpl{to{transform:scale(1.035)}}
.sig{position:absolute;z-index:3;width:18px;height:11px;border-radius:5px;background:#ff5a4a;border:2px solid #fff3;box-shadow:0 0 12px 5px rgba(255,70,50,.95);pointer-events:none;transform:translate(0,-50%)}
#fname{left:8px;top:40px;z-index:5;background:#ffeeb0;border:3px solid #000;border-left-width:10px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:900;line-height:1.2;max-width:62%;pointer-events:none}
.fin #fname,.fin #tabs,.fin #strips{display:none!important}
#lamp.bite{animation:bite .5s steps(3)}
@keyframes bite{0%{filter:none}30%{transform:translateX(-3px) rotate(-3deg);filter:hue-rotate(250deg) brightness(1.6)}60%{transform:translateX(3px) rotate(3deg);filter:brightness(.4)}100%{transform:none;filter:none}}
#beacon .lamp.lt{fill:#ffd24a;filter:drop-shadow(0 0 5px #ffb300)}
.fly.bgf{opacity:.8;scale:.55}
@media (prefers-reduced-motion:reduce){#spark,.twk,.fly .w,#glitch svg,.tile.run{animation:none!important}#scene.shake{animation:none}#boom{display:none}}

#strips{flex:none;background:#0b1233;border:3px solid #000;border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;gap:4px;direction:ltr}
.srow{display:flex;align-items:center;gap:6px;height:28px}
.srow .si{flex:none;width:24px;height:24px}
.si.fl{border-radius:50%;background:var(--c);border:2.5px solid #000;box-shadow:0 0 9px var(--c)}
.scells{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.sg{display:flex;flex:none}
.sc{height:24px;background:#222c58;border-top:2px solid #000;border-bottom:2px solid #000;flex:none}
.sc.on{background:var(--c)}
.sc.first,.sc.chg{border-left:2px solid #000}
.sc.last{border-right:2px solid #000}
.sc.bt{box-shadow:inset -1px 0 0 rgba(0,0,0,.3)}
.sc.hl{outline:3px solid #fff;outline-offset:-3px;filter:brightness(1.35);position:relative;z-index:1}
.sc.bad{outline:3px solid #ff4d4d;outline-offset:-3px;animation:pp .6s infinite;position:relative;z-index:2}
.sx{flex:none;font:900 18px 'Trebuchet MS',Verdana,sans-serif;color:#fff;min-width:36px;text-align:end}
.mini{width:34px;height:34px}
.tile{height:40px;gap:6px}
.tile .mini.x{margin-inline-start:16px;width:40px}
.st{gap:6px}
.st b{height:34px;line-height:28px;min-width:34px}
.rep .st b{height:34px;line-height:28px}
#body{gap:4px}
.rep{height:46px}
#lua{height:30px;font-size:11px}
#run,#next,#show{height:50px}
.caprow{flex:none;display:flex;align-items:flex-start}
.caprow .repcap{flex:0 0 40%;margin-inline-end:0}
#undo{margin-inline-start:auto;height:34px;padding:0 14px;border:3px solid #000;border-radius:9px;background:#ffd23f;font:900 15px 'Trebuchet MS',Verdana,sans-serif;box-shadow:0 3px 0 #000;color:#1a1020;margin-top:4px}

.fly.hide{display:none!important}
#hud{gap:5px}
.pip{width:30px;height:30px;border:3px solid #000;border-radius:50%;background:#1b2750;color:#8f9bc8;font:900 15px/1 'Trebuchet MS',Verdana,sans-serif;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 0 #000;cursor:pointer}
.pip.done{background:hsl(var(--h) 100% 62%);color:#10200a;box-shadow:0 0 10px hsl(var(--h) 100% 60%),0 2px 0 #000}
.pip.cur{border-color:#fff;color:#fff;background:#3a4a9a;animation:pp 1.3s infinite}
.pip.cur.done{color:#10200a;background:hsl(var(--h) 100% 62%)}
.pip.lock{opacity:.4;cursor:default}

    steps.push({t0:t0,i:i})});
  return{ev:ev,steps:steps,total:t}}

setInterval(function(){if(RM||document.hidden||finale)return;var e=document.createElement('i');e.className='star';e.style.left=(35+Math.random()*55)+'%';e.style.top=(4+Math.random()*18)+'%';scene.appendChild(e);setTimeout(function(){e.remove()},1000)},9000);


var lastAct=0,lastRm=null,undoT=0,stripCells={T:[],M:[]},hlEl={T:null,M:null};
function hideUndo(){}
function units(p){var b=build(p),n=Math.round(b.total*2),a=[],k;for(k=0;k<n;k++)a.push(stateAt(b.ev,k*.5));return a}
function drawStrip(sel,key,p,color){
  var row=$(sel),a=units(p),rep=p.rep,L=rep?Math.round(a.length/rep):0,land=wrap.classList.contains('land'),avail=land?340:275,
      cw=Math.max(2,Math.min(26,(avail-(rep-1)*6)/Math.max(1,a.length))),h='',r,k;
  for(r=0;r<rep;r++){h+='<div class="sg">';for(k=r*L;k<(r+1)*L;k++){var c='sc'+(a[k]?' on':'')+(k===r*L?' first':'')+(k===(r+1)*L-1?' last':'')+(k>r*L&&a[k]!==a[k-1]?' chg':'')+(k%2?' bt':'');h+='<i class="'+c+'" style="width:'+cw+'px"></i>'}h+='</div>'}
  var sc=row.querySelector('.scells');sc.innerHTML=h;row.style.setProperty('--c',color);row.querySelector('.sx').textContent='\u00d7'+rep;
  stripCells[key]=[].slice.call(sc.querySelectorAll('.sc'));hlEl[key]=null}
function renderStrips(){
  var L=LV[lvl];if(!L||!L.target){$('#strips').style.display='none';return}
  $('#strips').style.display='flex';drawStrip('#srT','T',L.target,'hsl('+L.hue+' 100% 62%)');drawStrip('#srM','M',prog,'#ffe14d')}
function hlStrip(key,t){var i=Math.floor(t*2),c=stripCells[key][i];if(hlEl[key]===c)return;if(hlEl[key])hlEl[key].classList.remove('hl');hlEl[key]=c||null;if(c)c.classList.add('hl')}
function clearHl(){['T','M'].forEach(function(k){if(hlEl[k])hlEl[k].classList.remove('hl');hlEl[k]=null})}
function diffInfo(){
  var tg=LV[lvl].target;
  function strip(a){var i=0;while(i<a.length&&!a[i])i++;var e=a.length;while(e>i&&!a[e-1])e--;return{a:a.slice(i,e),lead:i}}
  var A=strip(units(prog)),B=strip(units(tg)),n=Math.max(A.a.length,B.a.length);
  for(var d=0;d<n;d++){var m=A.a[d],f=B.a[d];if(m!==f){return{key:m===undefined?'d3':f===undefined?'d4':f?'d2':'d1',mi:A.lead+d,fi:B.lead+d}}}
  return null}
function markBad(df){document.querySelectorAll('.sc.bad').forEach(function(n){n.classList.remove('bad')});var a=stripCells.M[df.mi],b=stripCells.T[df.fi];if(a)a.classList.add('bad');if(b)b.classList.add('bad')}


var wilds=[$('#wild')];
['wild2','wild3'].forEach(function(id){var d=document.createElement('div');d.id=id;d.className='fly hide';d.innerHTML='<i class="w w1"></i><i class="w w2"></i><i class="b"></i>';scene.insertBefore(d,$('#colls'));wilds.push(d)});
var bn=mk('lvstart');bn.addEventListener('click',hideBanner);
/* ---- bonus: catch the fireflies ---- */
var BP=[[1,1],[1,3],[.5,.5],[2,1],[1,2],[.5,2],[2,2],[1,.5]],BH=[60,185,305,35,120,330],bonusEl=$('#bonus'),bfs=[],jarN=0,bRaf=0;
function bsz(){return[bonusEl.clientWidth,bonusEl.clientHeight]}
function bfLabel(b){b.lb.textContent=t('on')+' '+fmt(b.on)+' \u00b7 '+t('off')+' '+fmt(b.off)}
function spawnBf(b){var p=BP[Math.floor(Math.random()*BP.length)];b.on=p[0];b.off=p[1];b.x=.1+Math.random()*.8;b.y=.24+Math.random()*.38;b.ph=Math.random()*6;b.o=Math.random()*(p[0]+p[1]);b.hue=BH[Math.floor(Math.random()*BH.length)];b.fl.style.setProperty('--h',b.hue);bfLabel(b);b.dead=0;b.el.style.opacity=1;b.el.style.display=''}
function openBonus(){if(!bonusUnlocked)return;stopRun();clearPoint();bonusOpen=true;bonusEl.classList.add('show');
  if(!bfs.length){var f=$('#bfield');for(var i=0;i<6;i++){var e=document.createElement('button');e.className='bf';e.innerHTML='<div class="fly"><i class="w w1"></i><i class="w w2"></i><i class="b"></i></div><span class="lb2"></span>';f.appendChild(e);var b={el:e,fl:e.firstChild,lb:e.lastChild};e._b=b;bfs.push(b);spawnBf(b)}
    $('#bbg').innerHTML=$('#bg').innerHTML}
  jarUpd();cancelAnimationFrame(bRaf);bRaf=requestAnimationFrame(bonusFrame)}
function closeBonus(){bonusOpen=false;bonusEl.classList.remove('show');cancelAnimationFrame(bRaf)}
function jarUpd(){$('#bjar').style.setProperty('--g',Math.min(1,.12+jarN*.07));$('#jcount').textContent=t('jar')+' '+jarN}
function bonusFrame(now){
  if(!bonusOpen)return;var s=bsz(),beat=now/BEAT,tt=now/1000,am=RM?5:1;
  bfs.forEach(function(b){if(b.dead)return;var cyc=b.on+b.off,p=(beat+b.o)%cyc;b.fl.classList.toggle('on',p<b.on);b.grace=p<b.on+.3;
    b.el.style.left=(s[0]*b.x+Math.sin(tt*.6+b.ph)*30*am)+'px';b.el.style.top=(s[1]*b.y+Math.cos(tt*.8+b.ph)*18*am)+'px'});
  bRaf=requestAnimationFrame(bonusFrame)}
async function catchBf(b){
  b.dead=1;var s=bsz(),sx=parseFloat(b.el.style.left),sy=parseFloat(b.el.style.top),tx=s[0]/2,ty=s[1]-60;
  b.fl.classList.add('on');burst(sx,sy,10,b.hue,false,bonusEl);blip(660,.08);setTimeout(function(){blip(880,.08)},80);
  await tween(650,function(u){var e=ease(u);b.el.style.left=(sx+(tx-sx)*e)+'px';b.el.style.top=(sy+(ty-sy)*e-Math.sin(Math.PI*u)*40)+'px';b.el.style.scale=1-.7*e});
  b.el.style.display='none';b.el.style.scale=1;jarN++;jarUpd();burst(tx,ty,8,b.hue,false,bonusEl);
  setTimeout(function(){if(bonusOpen||true)spawnBf(b)},900)}
function missBf(b){b.el.setAttribute('data-h',t('hihi'));b.el.classList.remove('hh');void b.el.offsetWidth;b.el.classList.add('hh');blip(300,.08);setTimeout(function(){b.el.classList.remove('hh')},800)}
$('#bfield').addEventListener('click',function(e){var el=e.target.closest('.bf');if(!el)return;var b=el._b;if(b.dead)return;if(b.grace)catchBf(b);else missBf(b)});
$('#bback').addEventListener('click',closeBonus);
$('#btnBonus').addEventListener('click',function(){if(busy&&!cardState||finale)return;openBonus()});
$('#hud').addEventListener('click',function(e){var b=e.target.closest('[data-lv]');if(!b||b.disabled||busy||finale||cardState||bonusOpen)return;var i=+b.dataset.lv;if(i===lvl)return;loadLevel(i)});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b||busy)return;cur=+b.dataset.tab;prog=progs[cur];tabs();render();clearPoint()});
$('#wcard').addEventListener('click',function(e){
  if(e.target.closest('#cbonus')){openBonus();return}
  if(e.target.closest('#cnext')){var c=cardState;closeCard();if(c.idx>=0)loadLevel(c.idx);else startFinale()}});

/* ---------- init ---------- */
buildBg();buildBeacon();
$('#lamp').innerHTML=lampSvg();$('#helper').innerHTML=helperSvg();$('#spark').innerHTML=sparkSvg();
$('#capface').className='face spark';$('#capface').innerHTML=sparkSvg();$('#finspark').innerHTML=sparkSvg();
$('#finspark').className='big spark cheer';
document.addEventListener('click',onAct);
$('#run').addEventListener('click',onRun);$('#show').addEventListener('click',onShow);
$('#next').addEventListener('click',function(){loadLevel(lvl+1)});
$('#again').addEventListener('click',again);
$('#btnHelp').addEventListener('click',onHelp);$('#btnSnd').addEventListener('click',toggleSnd);
addEventListener('resize',fit);
function setLang(code){
  lang=code;var d=document.documentElement;d.lang=T[code].lang;d.dir=T[code].dir;
  $('#langBar').innerHTML=LANGS.map(function(c){return '<button class="lb'+(c===code?' on':'')+'" type="button" data-l="'+c+'">'+c+'</button>'}).join('');
  document.querySelectorAll('[data-t]').forEach(function(n){n.textContent=t(n.dataset.t)});
  document.querySelectorAll('[data-a]').forEach(function(n){n.setAttribute('aria-label',t(n.dataset.a))});
  if(prog){render();setRunBtn();nameChip()}if(cardState)renderCard();if(bn.classList.contains('show'))bn.innerHTML=bannerHtml(bn._n);bfs.forEach(bfLabel);jarUpd();
  if(lastSay)say(lastSay[0],lastSay[1],lastSay[2]);
  fit()}
$('#langBar').addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(b)setLang(b.dataset.l)});
setLang('EN');loadLevel(0);requestAnimationFrame(ambient);
window.__game={done:function(){return done.slice()},go:function(n){loadLevel(n)},card:function(){return cardState},bonus:function(){bonusUnlocked=true;bonusBtn();openBonus()},bfs:function(){return bfs},setLang:setLang,LV:LV,get prog(){return prog},set prog(p){prog=p;render()},get lvl(){return lvl},judge:judge,build:build,segs:segs};
})();
